name: Notify main CI failure

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a test Feishu alert card.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  workflow_run:
    workflows:
      - ci
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository == 'sunseol/opendesign-tauri' &&
        vars.MAIN_CI_FEISHU_ENABLED == 'true' &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.send_test == 'true'
          ) ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion)
          )
        )
      }}
    steps:
      - name: Send main CI failure alert
        uses: actions/github-script@v7
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_MAIN_CI_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.FEISHU_WEBHOOK;
            if (!webhook) {
              core.setFailed('Missing FEISHU_MAIN_CI_WEBHOOK secret.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isTest = context.eventName === 'workflow_dispatch';
            const run = isTest
              ? {
                  id: context.runId,
                  name: 'main-ci-alert-test',
                  conclusion: 'failure',
                  event: 'workflow_dispatch',
                  head_branch: context.ref.replace(/^refs\/heads\//, ''),
                  head_sha: context.sha,
                  run_started_at: new Date().toISOString(),
                  created_at: new Date().toISOString(),
                  updated_at: new Date().toISOString(),
                  display_title: 'Manual Feishu alert smoke test',
                  html_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  actor: context.actor ? { login: context.actor } : null,
                  head_commit: {
                    message: 'Manual Feishu alert smoke test',
                    author: { name: context.actor || 'unknown' },
                  },
                }
              : context.payload.workflow_run;

            const startedAt = new Date(run.run_started_at || run.created_at).getTime();
            const updatedAt = new Date(run.updated_at).getTime();
            const durationMinutes = Number.isFinite(startedAt) && Number.isFinite(updatedAt)
              ? Math.round((updatedAt - startedAt) / 60000)
              : null;

            const problemJobs = isTest
              ? [{ name: 'Feishu notification smoke test', conclusion: 'failure', id: 0 }]
              : (await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                })).data.jobs.filter((job) => ['failure', 'timed_out'].includes(job.conclusion));

            if (!isTest && problemJobs.length === 0) {
              core.info('Skipping run with no failed or timed-out jobs.');
              return;
            }

            function textFromLogData(data) {
              if (typeof data === 'string') {
                return data;
              }
              if (data instanceof ArrayBuffer) {
                return Buffer.from(data).toString('utf8');
              }
              if (ArrayBuffer.isView(data)) {
                return Buffer.from(data.buffer).toString('utf8');
              }
              return String(data || '');
            }

            function extractSignals(text) {
              const signals = [];
              const patterns = [
                /##\[error\].+/,
                /^\s*Error:.+/,
                /Test timeout of \d+ms exceeded.*/i,
                /strict mode violation.*/i,
                /Process from config\.webServer was not able to start.*/i,
                /Cannot find module.*/i,
                /No space left on device.*/i,
              ];
              for (const line of text.split('\n')) {
                const clean = line.replace(/\x1b\[[0-9;]*m/g, '').trim();
                if (patterns.some((pattern) => pattern.test(clean))) {
                  signals.push(clean.slice(0, 220));
                }
                if (signals.length >= 4) {
                  break;
                }
              }
              return [...new Set(signals)];
            }

            function classifyFailure({ conclusion, jobs, logs }) {
              const text = `${jobs.map((job) => `${job.name} ${job.conclusion}`).join('\n')}\n${logs.join('\n')}`;
              if (conclusion === 'timed_out' || /timeout|timed out/i.test(text)) {
                return {
                  category: 'Possible timeout/resource issue',
                  action: 'Check the longest failed job first, then rerun failed jobs if runner health looks normal.',
                };
              }
              if (/webServer|Cannot find module|node_modules|No space left|ENOSPC|playwright install/i.test(text)) {
                return {
                  category: 'CI environment or dependency setup issue',
                  action: 'Check dependency install, Playwright browser setup, runner disk, and webServer startup logs.',
                };
              }
              if (/strict mode violation|getBy(TestId|Role|Text|Label|Placeholder)|locator\.(click|fill|hover)/i.test(text)) {
                return {
                  category: 'Possible stale UI selector or test drift',
                  action: 'Compare the failed selector or copy with the current Tauri/web shell before treating it as product regression.',
                };
              }
              if (/500|502|503|504|Internal Server Error|Bad Gateway|Generation failed|No output/i.test(text)) {
                return {
                  category: 'Possible product or API regression',
                  action: 'Reproduce the related flow and inspect the recently merged app/runtime changes.',
                };
              }
              return {
                category: 'Needs manual triage',
                action: 'Open the failed job log and inspect the first real failure.',
              };
            }

            const logTexts = [];
            if (isTest) {
              logTexts.push([
                'Error: locator.click: Test timeout of 30000ms exceeded.',
                "Call log: waiting for getByRole('dialog')",
              ].join('\n'));
            } else {
              for (const job of problemJobs.slice(0, 6)) {
                try {
                  const logResponse = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner,
                    repo,
                    job_id: job.id,
                  });
                  logTexts.push(textFromLogData(logResponse.data).slice(-80_000));
                } catch (error) {
                  core.warning(`Failed to download logs for ${job.name}: ${error.message}`);
                }
              }
            }

            const triage = classifyFailure({
              conclusion: run.conclusion,
              jobs: problemJobs,
              logs: logTexts,
            });
            const signals = extractSignals(logTexts.join('\n'));
            const pull = isTest
              ? null
              : (await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: run.head_sha,
                })).data[0];
            const prText = pull
              ? `#${pull.number} ${pull.title}\n${pull.html_url}`
              : (isTest ? 'Manual test, no related PR' : 'No related PR found');
            const failedJobs = problemJobs
              .map((job) => `- ${job.name} (${job.conclusion})`)
              .join('\n') || '- Unknown';
            const signalText = signals.length
              ? signals.map((signal) => `- ${signal}`).join('\n')
              : '- No compact failure signal parsed; open the job logs.';
            const shortSha = run.head_sha.slice(0, 7);
            const author = run.head_commit?.author?.name || run.actor?.login || 'unknown';
            const subject = run.head_commit?.message?.split('\n')[0] || run.display_title || 'unknown';
            const title = isTest
              ? '[TEST] Open Design Tauri main CI alert'
              : 'Open Design Tauri main CI failed';

            const body = {
              msg_type: 'interactive',
              card: {
                config: {
                  wide_screen_mode: true,
                },
                header: {
                  template: 'red',
                  title: {
                    tag: 'plain_text',
                    content: title,
                  },
                },
                elements: [
                  {
                    tag: 'div',
                    text: {
                      tag: 'lark_md',
                      content: [
                        `**Repository:** ${owner}/${repo}`,
                        `**Branch:** ${isTest ? run.head_branch : 'main'}`,
                        `**Workflow:** ${run.name}`,
                        `**Conclusion:** ${run.conclusion}`,
                        `**Duration:** ${durationMinutes === null ? 'unknown' : `${durationMinutes}m`}`,
                        `**Commit:** ${shortSha}`,
                        `**Author:** ${author}`,
                        `**Subject:** ${subject}`,
                        `**Related PR:** ${prText}`,
                        `**Triage:** ${triage.category}`,
                        `**Suggested action:** ${triage.action}`,
                      ].join('\n'),
                    },
                  },
                  {
                    tag: 'div',
                    text: {
                      tag: 'lark_md',
                      content: `**Failed jobs:**\n${failedJobs}\n\n**Signals:**\n${signalText}`,
                    },
                  },
                  {
                    tag: 'action',
                    actions: [
                      {
                        tag: 'button',
                        text: {
                          tag: 'plain_text',
                          content: 'Open run',
                        },
                        type: 'primary',
                        url: run.html_url,
                      },
                    ],
                  },
                ],
              },
            };

            const response = await fetch(webhook, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
              },
              body: JSON.stringify(body),
            });
            const responseText = await response.text();
            let responseJson = null;
            try {
              responseJson = JSON.parse(responseText);
            } catch {
              responseJson = null;
            }
            const feishuCode = responseJson?.StatusCode ?? responseJson?.code;
            const hasFeishuError = feishuCode !== undefined && Number(feishuCode) !== 0;
            if (!response.ok || hasFeishuError) {
              core.setFailed(`Feishu notification failed: ${response.status} ${responseText}`);
              return;
            }
            core.info(`Feishu notification accepted: ${response.status} ${responseText}`);
