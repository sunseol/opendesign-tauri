name: landing-page-production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why promote now? Recorded in the run log.'
        required: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: landing-page-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page to production
    if: >-
      github.repository == 'sunseol/opendesign-tauri'
      && github.ref == 'refs/heads/main'
      && vars.LANDING_PAGE_DEPLOY_ENABLED == 'true'
      && vars.LANDING_PAGE_PRODUCTION_PROJECT != ''
      && vars.LANDING_PAGE_PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.LANDING_PAGE_PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./apps/landing-page/package.json').devDependencies.playwright.replace(/[^0-9.]/g,'')")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache generated previews
        id: previews-cache
        uses: actions/cache@v5.0.5
        with:
          path: apps/landing-page/public/previews
          key: landing-page-previews-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'apps/landing-page/package.json', 'apps/landing-page/scripts/generate-previews.ts', 'skills/**', 'design-templates/**', 'templates/**', 'prompt-templates/**', 'plugins/_official/**') }}
          restore-keys: |
            landing-page-previews-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @open-design/landing-page exec playwright install --with-deps chromium

      - name: Typecheck landing page
        run: pnpm --filter @open-design/landing-page typecheck

      - name: Generate skill + template previews
        if: steps.previews-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @open-design/landing-page previews

      - name: Build landing page
        env:
          OD_LANDING_SITE: ${{ vars.LANDING_PAGE_PRODUCTION_URL }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: pnpm --filter @open-design/landing-page build

      - name: Verify zero external JavaScript
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const html = readFileSync('apps/landing-page/out/index.html', 'utf8');
          const forbidden = [
            /<script\b[^>]*\bsrc=/i,
            /type=["']module["']/i,
            /\/_astro\/[^"'<>\s]+\.js/i,
          ];
          for (const pattern of forbidden) {
            if (pattern.test(html)) {
              console.error(`Unexpected client JavaScript matched ${pattern}`);
              process.exit(1);
            }
          }
          NODE

      - name: Verify deploy file count under Cloudflare Pages cap
        run: |
          count=$(find apps/landing-page/out -type f | wc -l | tr -d '[:space:]')
          echo "landing-page deploy file count: $count"
          if [ "$count" -ge 19000 ]; then
            echo "::error::landing-page build emitted $count files; Cloudflare Pages caps deployments at 20,000."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing-page
          packageManager: npm
          command: >
            pages deploy out
            --project-name=${{ vars.LANDING_PAGE_PRODUCTION_PROJECT }}
            --branch=main
